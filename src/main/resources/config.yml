reset-interval: 15m
active-quest-count: 3
claim-radius: 6

bossbar:
  # Only the currently selected quest is shown. There is no idle /quests boss bar.
  enabled: true
  color: YELLOW
  cycle-seconds: 5

messages:
  reset: '&#ff9900&lQUESTS &8» &fNew quests are now available! Use &#7afc00/quests&f.'
  completed: '&#7afc00&lQUEST COMPLETE! &fYou completed &e%quest%&f.'
  click-to-claim: '&#ff9900&l[CLICK TO TELEPORT TO THE QUEST NPC]'
  claim-hover: '&fTeleport to the Quest NPC, then click your completed quest to receive $%reward%.'
  returned-to-npc: '&fYou returned for &e%quest%&f. Click the completed quest in the menu to receive your money.'
  claim-near-npc: '&cYou must return to the Quest NPC before claiming this reward. Click the teleport message in chat.'
  claimed: '&#7afc00&lREWARD CLAIMED! &fYou received &#7afc00$%reward%&f for &e%quest%&f.'
  payout-failed: '&cVault could not add your reward. Your reward is still available—please try again or contact an administrator.'
  selected: '&#7afc00&lQUEST SELECTED! &fYou selected &e%quest%&f.'
  already-selected: '&eYou already selected this quest.'
  finish-selected: '&cYou can only work on one quest at a time. Finish your selected quest first.'
  already-claimed: '&cYou have already claimed this quest reward.'
  already-completed-until-reset: '&cYou already completed &e%quest%&c this cycle. Wait for the next quest reset before doing it again.'
  claim-expired: '&cThat quest reward is no longer available.'
  npc-not-set: '&cThe Quest NPC location has not been set. Ask an administrator to use /quests setnpc.'
  npc-set: '&aQuest NPC location saved at your current position.'
  # Shown in the action bar above the hotbar, not in chat.
  progress: '&8[&#ff9900Quest&8] &f%quest%: &#7afc00%progress%&7/&#7afc00%required%'
  reload: '&aMagicQuests configuration reloaded.'
  time-changed: '&aQuest reset time changed to &f%time%&a.'
  economy-missing: '&cNo Vault economy provider was found.'

sounds:
  complete: ENTITY_PLAYER_LEVELUP
  progress: BLOCK_NOTE_BLOCK_PLING
  selected: UI_BUTTON_CLICK
  error: ENTITY_VILLAGER_NO

npc-location: {}

